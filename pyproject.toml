[project]
name = "araspellx"
version = "0.1.0"
description = "Character-level Arabic transformer for spelling and OCR error correction, trained from scratch"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.3.0+cu121",
    "transformers>=4.44,<5",
    "tokenizers>=0.22.2",
    "numpy==1.26.4",
    "rapidfuzz>=3.14.5",
    "mwparserfromhell>=0.7.2",
    "tqdm==4.66.0",
    "tensorboard==2.16.0",
    "setuptools<81",          # tensorboard 2.16 imports pkg_resources
    "onnx>=1.19.0",           # ONNX export for the CPU speed benchmark
    "onnxruntime>=1.18,<1.24",
    "ml-dtypes>=0.5",         # required by onnx
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
