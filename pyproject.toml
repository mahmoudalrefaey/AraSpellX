[project]
name = "araspellx-legacy"
version = "0.1.0"
description = "AraSpellX v0: AraSpell-style character-level seq2seq Arabic spelling correction (baseline, not maintained)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.3.0+cu121",
    "torchvision==0.18.0+cu121",
    "torchaudio==2.3.0+cu121",
    "matplotlib==3.8.0",
    "pandas==2.2.0",
    "tensorboard==2.16.0",
    "tqdm==4.66.0",
    "numpy==1.26.4",
    "setuptools<81",
    "editdistance>=0.8.1",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
torchvision = [{ index = "pytorch-cu121" }]
torchaudio = [{ index = "pytorch-cu121" }]
