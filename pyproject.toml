[project]
name = "araspell"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==1.12.0+cu116",
    "torchvision==0.13.0+cu116",
    "torchaudio==0.12.0",
    "matplotlib==3.5.2",
    "pandas==1.4.3",
    "tensorboard==2.9.1",
    "tqdm==4.64.0",
    "numpy==1.26.4",
    "setuptools<81",
]

[[tool.uv.index]]
name = "pytorch-cu116"
url = "https://download.pytorch.org/whl/cu116"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu116" }]
torchvision = [{ index = "pytorch-cu116" }]
torchaudio = [{ index = "pytorch-cu116" }]
